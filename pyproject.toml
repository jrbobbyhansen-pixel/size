[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "size"
version = "1.0.0"
description = "Analyze directory sizes with human-readable output and sorting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"

[project.scripts]
size = "size:main"

[tool.setuptools]
py-modules = ["size"]
